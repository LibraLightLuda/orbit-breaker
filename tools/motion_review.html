<!doctype html><html lang="ko"><meta charset="utf-8"><title>Orbit Breaker · 모션 검수</title><style>body{margin:0;background:#08121f;color:#eff;font:15px system-ui}header{display:flex;gap:12px;padding:12px;align-items:center}select,button{padding:8px;background:#203647;color:#dff;border:1px solid #497582}img{display:block;width:100%;max-height:88vh;object-fit:contain}input{width:50%}</style><header><b>실제 Godot 렌더 · 12fps</b><select id="clip"></select><button id="play">정지</button><input type="range" id="seek" min="0"><output id="frame"></output></header><img id="screen"><script>
const select=document.querySelector('#clip'),seek=document.querySelector('#seek'),img=document.querySelector('#screen'),label=document.querySelector('#frame');let clips=[],index=0,playing=true,cache=[];
fetch('motion-results.json').then(r=>r.json()).then(r=>{clips=r.clips;for(const c of clips)select.add(new Option(c.name,c.name));load()});
function load(){index=0;const c=clips[select.selectedIndex];seek.max=c.frames-1;cache=[];for(let i=0;i<c.frames;i++){const a=new Image();a.src=c.name+'-'+String(i).padStart(3,'0')+'.webp';cache.push(a)}show()}
function show(){if(!cache.length)return;img.src=cache[index].src;seek.value=index;label.textContent=index+' / '+(cache.length-1)}
select.onchange=load;seek.oninput=()=>{index=+seek.value;show()};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'정지':'재생'};setInterval(()=>{if(playing&&cache.length){index=(index+1)%cache.length;show()}},1000/12);
</script></html>
